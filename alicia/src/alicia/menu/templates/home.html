<title>ALICIA (beta)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/*__SITE_CSS__*/
/* Layout: the landing page. Two views of the competition landscape side by side (stacked on phones), each with its pages. */
.views { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: 20px; align-items: start; }
.view { display: grid; gap: 14px; align-content: start; }
.view-head { display: grid; gap: 4px; }
.view-head .kicker { color: var(--ink-3); }
.view-head p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.view-links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.view-link { display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); text-decoration: none; }
.view-link .name { font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.view-link .desc { color: var(--ink-2); font-size: var(--step--1); margin: 0; }
a.view-link:hover, a.view-link:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
a.view-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a.view-link .go { color: var(--accent); font-family: var(--font-body); font-size: var(--step--1); font-weight: 600; white-space: nowrap; }
.view-link.soon { border-style: dashed; background: transparent; }
.view-link.soon .name { color: var(--ink-2); }
.view-link.soon .badge { font-family: var(--font-body); font-size: var(--step--1); font-weight: 500; color: var(--ink-3); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
</style>

<div class="wrap">
  <header class="top">
    <!--__NAV__-->
    <p class="kicker">ALICIA · Australian Legislation Impact on Competition Industry Analysis</p>
    <h1>Competition across Australian industries <!--__BETA__--></h1>
    <p class="lede">Two ways into the same evidence. Start from the top, with the economy and the legislation that shapes it, or from the bottom, with a single industry and the regulation it faces.</p>
  </header>

  <main class="views">
    <!--__LANDING__-->
  </main>
</div>
