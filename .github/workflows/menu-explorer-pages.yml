# Builds the ALICIA website from the register and the processed panels, and publishes it with GitHub Pages:
# index.html (landing page: Top down and Bottom up views), growth.html (Structural competitive conditions, with
# the economic conditions at its end), menu.html (Legislative levers influencing competition: every item's
# framework assessment and industry statistics), industry-lens.html (Industry lens), framework.html (the
# productivity framework), methodology.html (how the site is made), conditions.html (a forward to growth.html for
# old links), and archive.html with one evaluation-<id>.html page per evaluation (the econometric archive).
# The Policy costing tab (regulatory-burden-tool/) is archived and is not part of the site (owner decision,
# 11 Nov 2026, alicia/DECISIONS.md E-134).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The page is then at https://<owner>.github.io/<repository>/. It is rebuilt on every push to main and once a
# day, when the parameters behind the menu's industry statistics and the Industry lens are checked against the
# publishers' latest releases: a new release (for example ABS Counts of Australian Businesses) reaches those
# pages on the next daily run, with no code change. The refreshed files are kept with each run as the
# "costing-data" artifact; the committed snapshot in data/processed/costing/ is updated by running
# `alicia costing-params --refresh`.
name: Publish the ALICIA website

on:
  push:
    branches: [main]
  schedule:
    # Daily at 02:17 UTC: after the ABS's 11:30 am Canberra-time releases, in both AEST and AEDT.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check the register and the Python toolkit
        working-directory: alicia
        run: |
          uv sync --frozen
          uv run pytest -q
          uv run alicia validate
      - name: Refresh the parameters data from the publishers' latest releases
        working-directory: alicia
        run: |
          # A source that can't be reached keeps its committed release and is marked "fallback";
          # the summary of what changed goes to this run's summary page.
          uv run alicia costing-params --refresh --report "$RUNNER_TEMP/costing-refresh.md"
          cat "$RUNNER_TEMP/costing-refresh.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the pages
        working-directory: alicia
        run: |
          dates="$(ls ../regulation-register/reports/effective_dates_*.json | sort | tail -n 1)"
          uv run alicia site -o ../site --dates "$dates" \
            --repo-base "https://github.com/${{ github.repository }}/blob/${{ github.sha }}/"
      - name: Keep the parameters data used for this build
        uses: actions/upload-artifact@v4
        with:
          name: costing-data
          path: |
            data/processed/costing/
            data/manifests/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
