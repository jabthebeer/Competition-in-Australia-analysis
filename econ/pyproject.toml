[project]
name = "regimpact"
version = "0.1.0"
description = "Public-data toolkit for evaluating how Australian regulatory changes affect competition: a register of changes, legislation effective dates, and (later) outcome panels and estimators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14,<3",
    "httpx>=0.28,<1",
    "pandas>=2.2",
    "numpy>=2.0",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
regimpact = "regimpact.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regimpact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
